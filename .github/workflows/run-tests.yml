# Run tests (including those added in recent commits) on push and pull_request
name: Run Tests

on:
  push:
    branches: [dev-v2, main, master]
  pull_request:
    branches: [dev-v2, main, master]

jobs:
  test:
    name: Maven Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install root POM (so core can resolve parent)
        run: mvn install -N -B

      - name: Run SDK tests (root)
        run: mvn clean test -B --fail-at-end

      - name: Run Core tests
        run: |
          cd core
          mvn clean test -B --fail-at-end
